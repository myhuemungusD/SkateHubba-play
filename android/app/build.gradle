apply plugin: 'com.android.application'

// ---- Version resolution ----------------------------------------------------
// Single source of truth: package.json at the repo root. CI can override.
//
// versionName precedence:
//   1. -PversionName=x.y.z  (Gradle project property, typically from CI)
//   2. package.json "version" (local dev default)
//
// versionCode precedence:
//   1. -PversionCode=NNN       (Gradle project property, e.g. CI run number)
//   2. ANDROID_VERSION_CODE    (environment variable)
//   3. Computed from versionName as major*10000 + minor*100 + patch
//      (e.g. 1.2.3 -> 10203). Fallback only; CI should always pass an
//      explicit monotonically-increasing -PversionCode for Play Store.
def pkgJsonFile = file("../../package.json")
def pkgJson = new groovy.json.JsonSlurper().parse(pkgJsonFile)
def resolvedVersionName = project.hasProperty('versionName') ? project.versionName : pkgJson.version

def resolvedVersionCode
if (project.hasProperty('versionCode')) {
    resolvedVersionCode = project.versionCode.toString().toInteger()
} else if (System.getenv('ANDROID_VERSION_CODE')) {
    resolvedVersionCode = System.getenv('ANDROID_VERSION_CODE').toInteger()
} else {
    def parts = resolvedVersionName.toString().split('\\.')
    def major = parts.length > 0 ? parts[0].toInteger() : 0
    def minor = parts.length > 1 ? parts[1].toInteger() : 0
    def patch = parts.length > 2 ? parts[2].replaceAll('[^0-9].*$', '').toInteger() : 0
    resolvedVersionCode = major * 10000 + minor * 100 + patch
}
// ---------------------------------------------------------------------------

// ---- Release signing -------------------------------------------------------
// One keystore, three entry points so local fastlane runs, plain
// `./gradlew bundleRelease`, and CI all produce identically-signed artifacts.
// Resolution order (first match wins):
//   1. android/keystore.properties (local dev; gitignored — copy
//      keystore.properties.example and fill in real values)
//   2. KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD env vars
//      (all four required — partial env fails the configuration)
//   3. -Pandroid.injected.signing.* Gradle properties (CI), which AGP applies
//      with precedence over the signingConfig below regardless of 1/2.
// storeFile paths are resolved from the android/ root; absolute paths (as CI
// passes) work unchanged. AGP happily emits an UNSIGNED bundle when no
// signingConfig is set, so the guard after the android block fails
// bundleRelease/assembleRelease explicitly when no source is configured.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
} else if (System.getenv("KEYSTORE_FILE")) {
    def signingEnv = ["KEYSTORE_FILE", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"]
    def missingEnv = signingEnv.findAll { !System.getenv(it) }
    if (!missingEnv.isEmpty()) {
        throw new GradleException("Partial Android signing env: missing ${missingEnv.join(', ')} " +
                "(set all four of ${signingEnv.join(', ')}, or none and use android/keystore.properties)")
    }
    keystoreProps.setProperty("storeFile", System.getenv("KEYSTORE_FILE"))
    keystoreProps.setProperty("storePassword", System.getenv("KEYSTORE_PASSWORD"))
    keystoreProps.setProperty("keyAlias", System.getenv("KEY_ALIAS"))
    keystoreProps.setProperty("keyPassword", System.getenv("KEY_PASSWORD"))
}
def hasReleaseSigning = keystoreProps.getProperty("storeFile") != null
// ---------------------------------------------------------------------------

android {
    namespace = "com.skatehubba.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.skatehubba.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Fail fast on unsigned release builds. Without this, AGP silently emits an
// unsigned AAB when no signingConfig is set and the mistake only surfaces at
// Play upload. Execution-time (doFirst) so debug builds, sync, and other
// tasks are unaffected. `-Pandroid.injected.signing.store.file` counts as
// configured because AGP applies injected signing over the DSL config.
tasks.configureEach { task ->
    if (task.name == "bundleRelease" || task.name == "assembleRelease") {
        task.doFirst {
            if (!hasReleaseSigning && !project.hasProperty("android.injected.signing.store.file")) {
                throw new GradleException("Release signing not configured — provide android/keystore.properties, " +
                        "KEYSTORE_* env vars, or -Pandroid.injected.signing.* properties. " +
                        "See android/keystore.properties.example.")
            }
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
