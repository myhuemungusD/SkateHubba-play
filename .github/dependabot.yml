version: 2
updates:
  # ── Root web app (React SPA + build/test tooling) ──
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Supply-chain buffer: wait 3 days after a release before proposing it,
    # so a hijacked publish is usually yanked before it reaches a PR.
    # Security updates ignore cooldown and still open immediately.
    cooldown:
      default-days: 3
    commit-message:
      # `chore` is hidden in release-please changelog-sections, so dependency
      # bumps don't churn the CHANGELOG or force a version bump; they ride
      # into the next feat/fix release.
      prefix: chore
      include: scope
    # `@sentry/capacitor` declares an EXACT peerOptional pin on `@sentry/react`
    # (4.2.0 → `@sentry/react@10.60.0`), so any independent bump of
    # `@sentry/react` makes `npm ci` fail with ERESOLVE and the PR is
    # unmergeable by construction. Observed on PR #488, which bumped
    # `@sentry/react` to 10.69.0 while no `@sentry/capacitor` release accepted
    # it. `@sentry/react` must therefore move only in lockstep with a
    # `@sentry/capacitor` release — bump the pair by hand when Sentry ships one
    # (this also covers the tracked v3→v4 Capacitor migration, AUDIT_2026-05 F9).
    ignore:
      - dependency-name: "@sentry/react"
      # eslint-plugin-react-hooks 7.1 promotes the React Compiler rules
      # (set-state-in-effect, refs, purity) to errors in the recommended
      # config: 22 lint errors in src/ (seen on #615). Hold it at 7.0.x until
      # those are fixed, then delete this entry.
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7.1.0"]
    groups:
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  # ── Cloud Functions package (approved stats close-out function) ──
  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      functions-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions used across .github/workflows/** ──
  # NOTE: these PRs edit `uses:` pins inside .github/workflows/**, so each one
  # trips the `verify-workflow-changes` warning in pr-gate.yml by design —
  # that warning is the intended maintainer-review signal, not a failure.
  # `directories` (not `directory`) so the pins inside the local composite
  # action (.github/actions/*/action.yml) are kept current too; a plain
  # `directory: "/"` only scans .github/workflows.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # ── Ruby: fastlane, used by android-aab.yml to upload to Google Play ──
  # Without this entry Dependabot only opens security PRs here, and those keep
  # failing because fastlane pins rubyzip < 3 (see Dependabot alert for
  # rubyzip). Weekly version updates still pick up fixes fastlane allows.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      ruby-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
