name: Deploy Firebase Rules

# Automates deployment of Firestore security rules, Firestore composite
# indexes, and Cloud Storage rules whenever those files land on `main`.
#
# Only the rules/indexes surface is deployed — Cloud Functions, Hosting, and
# app code are explicitly excluded. Functions are deployed out-of-band by the
# maintainer; pr-gate.yml allowlists exactly the four approved stats close-out
# files under functions/src/ (see .github/BRANCH_PROTECTION.md and CLAUDE.md).
#
# Project resolution:
#   The deploy job reads the target project ID from the `FIREBASE_PROJECT_ID`
#   secret first.  If that secret is empty, it falls back to the `default`
#   project in `.firebaserc` (parsed with `jq`, preinstalled on GitHub-hosted
#   runners).  The step fails only when neither source provides a project ID.
#
# Authentication:
#   Uses Google Cloud Workload Identity Federation via
#   `google-github-actions/auth@v2` when both `FIREBASE_WIF_PROVIDER` and
#   `FIREBASE_WIF_SERVICE_ACCOUNT` secrets are set. Falls back to the legacy
#   `FIREBASE_TOKEN` secret so existing projects keep working.
#
#   The fallback is a RUNTIME one, not just a configuration one: if WIF is
#   configured but fails to authenticate, the job warns and continues on
#   `FIREBASE_TOKEN` rather than aborting. That is the lesson of #519 — a
#   FIREBASE_WIF_PROVIDER naming a provider GCP could not resolve held every
#   rules deploy for three weeks while a usable token sat in the same secret
#   store, and the visible symptom was players unable to upload a landed trick
#   because storage.rules in production predated the client.
#
#   NOTE: `FIREBASE_TOKEN` (from `firebase login:ci`) is DEPRECATED in
#   firebase-tools and is the most likely cause of a deploy that worked for
#   months then began failing. Migrate to WIF and verify/rotate the secret in
#   GitHub → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules-deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip the actual deploy step."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      pii_scan_verified:
        description: "Type i-ran-the-scan ONLY if you have just run migrate-users-private.mjs --verify against production and it reported offending=0."
        required: false
        default: ""
        type: string
  # Freshness guard. firebase-tools v15 has no reliable "fetch live deployed
  # rules" command to diff against HEAD, so instead we re-run the full deploy
  # daily. The deploy is idempotent (re-uploading identical rules is a no-op),
  # and any drift between `main` and production can therefore never exceed 24h.
  # If this scheduled deploy fails, the `Alert on deploy failure` step files an
  # issue exactly as it does for push-triggered deploys.
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily

concurrency:
  group: firebase-rules-deploy
  cancel-in-progress: false

# Default to read-only. Only the `deploy` job escalates (id-token for WIF,
# issues for the failure/success alert). `validate-rules` runs emulator tests
# and needs neither, so it inherits this minimal set.
permissions:
  contents: read

jobs:
  validate-rules:
    name: Validate rules against emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Run Firestore rules unit tests
        run: npm run test:rules

  deploy:
    name: Deploy to Firebase
    needs: validate-rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      # WIF auth mints a short-lived GCP credential from the OIDC token.
      id-token: write
      # The failure/success alert steps open, comment on, and close the
      # tracking issue so a broken rules deploy can never pass unnoticed.
      issues: write
      # `Resolve last successful deploy` reads this workflow's own run history
      # to establish which commit production's rules actually came from.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `Check whether rules expose public profile reads`
          # inspects firestore.rules as of the last successfully deployed
          # commit, which a depth-1 clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Firebase project
        id: project
        run: |
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID secret is empty — falling back to .firebaserc"
            # `// empty` returns "" when .projects or .default is missing,
            # rather than the literal string "null" that `jq -r .a.b` would
            # emit. Keeps the `-z` check below correct.
            PROJECT_ID=$(jq -r '.projects.default // empty' .firebaserc)
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Cannot resolve Firebase project ID."
            echo "Set the FIREBASE_PROJECT_ID secret, or add a default project to .firebaserc."
            exit 1
          fi
          echo "Resolved project: $PROJECT_ID"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      # ── Deploy freshness ──
      # Two steps below need one fact: which commit production's rules actually
      # came from. A run's `conclusion` alone is not that fact — a dry run
      # finishes green having deployed nothing — so check the `Deploy rules and
      # indexes` step of each recent successful run and take the first that
      # really ran. That sha drives how stale the failure alert reports
      # production to be, and whether this deploy would INTRODUCE the public
      # profile read or merely re-publish one that is already live.
      - name: Resolve last successful deploy
        id: last
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'firebase-rules-deploy.yml',
              status: 'success',
              per_page: 20,
            });
            for (const run of runs.data.workflow_runs) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo,
                run_id: run.id,
              });
              const deployed = jobs.data.jobs.some((job) =>
                (job.steps || []).some(
                  (step) => step.name === 'Deploy rules and indexes' && step.conclusion === 'success',
                ),
              );
              if (!deployed) continue;
              const days = Math.floor((Date.now() - Date.parse(run.updated_at)) / 86400000);
              core.setOutput('sha', run.head_sha);
              core.setOutput('days_stale', String(days));
              core.notice(`Production rules last deployed from ${run.head_sha} (${days} day(s) ago).`);
              return;
            }
            // Nothing in the recent window actually deployed. Report that as
            // unknown rather than guessing: both consumers below treat an empty
            // sha as "cannot tell" and take their conservative branch.
            core.setOutput('sha', '');
            core.setOutput('days_stale', '');
            core.warning('No successful deploy found in the last 20 successful runs.');

      - name: Detect available credentials
        id: creds
        env:
          WIF_PROVIDER: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_WIF_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Secrets must be surfaced via env first — referencing `secrets.*`
          # directly in step-level `if:` expressions evaluates to null at
          # validation time (documented GH Actions quirk), so a "gate" written
          # that way is always-on and never actually gates.
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            if ! [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
              echo "::error::FIREBASE_WIF_PROVIDER is invalid. Expected: projects/NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID"
              echo "Expected full resource name format:"
              echo "projects/123456789/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID"
              echo "Fix FIREBASE_WIF_PROVIDER in GitHub → Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "method=wif" >> "$GITHUB_OUTPUT"
            echo "Using Workload Identity Federation."
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "Using legacy FIREBASE_TOKEN. Migrate to WIF when convenient."
          else
            echo "::error::No Firebase credentials available."
            echo "Set FIREBASE_WIF_PROVIDER + FIREBASE_WIF_SERVICE_ACCOUNT (preferred),"
            echo "or FIREBASE_TOKEN (legacy) in GitHub → Settings → Secrets."
            exit 1
          fi

      # A WIF failure is NOT fatal on its own. A FIREBASE_WIF_PROVIDER that
      # passes the shape check above but names no provider GCP can resolve took
      # production rules 3+ weeks stale (#519) — every run red, the deploy step
      # skipped — while a FIREBASE_TOKEN sat unused in the same secret store,
      # because this step aborted the whole job. Capture the outcome instead and
      # let the next step decide, so a broken WIF config costs a warning rather
      # than the deploy.
      - name: Authenticate via Workload Identity Federation
        id: wif
        if: steps.creds.outputs.method == 'wif'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_WIF_SERVICE_ACCOUNT }}

      # `steps.creds.outputs.method` is the PREFERRED method; this is the one
      # that actually authenticated. Everything downstream must read the method
      # from here and never from `creds`, or it assumes Application Default
      # Credentials that the WIF step failed to write.
      - name: Resolve effective auth method
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PREFERRED: ${{ steps.creds.outputs.method }}
          WIF_OUTCOME: ${{ steps.wif.outcome }}
        run: |
          set -euo pipefail
          if [ "$PREFERRED" = "wif" ] && [ "$WIF_OUTCOME" = "success" ]; then
            echo "method=wif" >> "$GITHUB_OUTPUT"
            echo "Authenticated via Workload Identity Federation."
            exit 0
          fi
          if [ "$PREFERRED" = "wif" ]; then
            echo "::warning::WIF authentication FAILED — the Google error is in the step above."
            echo "::warning::FIREBASE_WIF_PROVIDER must be the full resource name of a provider that exists."
            echo "::warning::Read the correct value straight from GCP rather than composing it by hand:"
            echo "::warning::  gcloud iam workload-identity-pools providers describe PROVIDER_ID \\"
            echo "::warning::    --location=global --workload-identity-pool=POOL_ID --format='value(name)'"
            echo "::warning::The project segment is the project NUMBER, not the project ID."
          fi
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            # The auth action writes its credentials file and exports
            # GOOGLE_APPLICATION_CREDENTIALS *before* it fails token exchange,
            # leaving a dead external-account config pointed at by ADC.
            # firebase-tools prefers FIREBASE_TOKEN over ADC, so this is belt
            # and braces — but a half-written credential nobody cleared is
            # exactly the kind of thing that turns a fallback into a new
            # mystery. Clear it.
            echo "GOOGLE_APPLICATION_CREDENTIALS=" >> "$GITHUB_ENV"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> "$GITHUB_ENV"
            echo "::warning::Falling back to the legacy FIREBASE_TOKEN so the deploy still ships."
            exit 0
          fi
          echo "::error::No usable Firebase credentials — WIF failed and FIREBASE_TOKEN is unset."
          exit 1

      # ── PII gate — scoped to the rule that needs it ──
      # `users/{uid}` is publicly `get`-able so a shared /player/{uid} link
      # resolves for a signed-out visitor. Firestore rules cannot filter
      # fields — they allow or deny whole documents — so that rule is only
      # safe while no public user doc still carries a sensitive field inline.
      # A doc the public/private backfill missed would become world-readable
      # the moment it publishes, including the date of birth of a minor.
      #
      # This is a job step, not a runbook line, because rules deploy
      # AUTOMATICALLY on merge to main (see `on: push` above). A documented
      # manual step cannot gate an automated deploy — nobody is there to do it.
      #
      # It is deliberately scoped to rules that actually contain the public
      # read. Deploys that don't touch it are unaffected, so this cannot
      # become the step everyone learns to route around.
      - name: Check whether rules expose public profile reads
        id: pubread
        run: |
          set -euo pipefail
          # Literal grep for `allow get: if true;` rather than a rules parse.
          # Known weakness, stated rather than hidden: reformatting or renaming
          # that line makes this report "absent" and the gate silently stops
          # guarding. It fails OPEN, which is the wrong direction — accepted
          # only because the alternative (a rules parser in bash) is worse, and
          # because rules-tests/users-public-read.rules.test.ts fails loudly if
          # the public read is removed outright. Revisit if the rule moves.
          if grep -qE '^\s*allow get: if true;' firestore.rules; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Public profile read detected — PII scan required."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No public profile read in firestore.rules — PII scan not required."
            echo "introduced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Present at HEAD — but is this deploy PUBLISHING it, or re-publishing
          # something production already serves? The gate below only has teeth
          # in the first case: once the rule is live, refusing to deploy cannot
          # un-publish it, it only strands every other rule fix (#519 stranded a
          # Storage fix for three weeks exactly this way). So resolve which case
          # this is against the ruleset production actually runs.
          LAST_SHA="${{ steps.last.outputs.sha }}"
          # `git show ... | grep -q` is NOT safe here, and the first version of
          # this step got it wrong: grep -q exits the instant it matches and
          # closes the pipe, git show is still streaming a ~3000-line file and
          # dies of SIGPIPE (141), and `set -o pipefail` reports the whole
          # pipeline as failed — so a rule that IS present reads as absent. That
          # flipped `introduced` to true and hard-blocked the very deploy this
          # gate was rewritten to stop blocking (run #824). Materialise the old
          # ruleset to a file first: git show's exit status is then checked on
          # its own, and grep reads a file with no pipe to break.
          PREV_RULES="$(mktemp)"
          if [ -z "$LAST_SHA" ]; then
            # Cannot tell which ruleset is live — treat as an introduction.
            echo "introduced=true" >> "$GITHUB_OUTPUT"
            echo "Last deployed commit unknown — treating the public read as newly introduced."
          elif ! git show "$LAST_SHA:firestore.rules" > "$PREV_RULES" 2>/dev/null; then
            # The commit or the file is not reachable in this clone.
            echo "introduced=true" >> "$GITHUB_OUTPUT"
            echo "Cannot read firestore.rules at $LAST_SHA — treating the public read as newly introduced."
          elif grep -qE '^\s*allow get: if true;' "$PREV_RULES"; then
            echo "introduced=false" >> "$GITHUB_OUTPUT"
            echo "Public read already live in the deployed ruleset ($LAST_SHA)."
          else
            echo "introduced=true" >> "$GITHUB_OUTPUT"
            echo "Public read is NEW relative to the deployed ruleset ($LAST_SHA)."
          fi

      - name: Scan production for residual PII on public user docs
        if: ${{ github.event.inputs.dry_run != 'true' && steps.pubread.outputs.present == 'true' }}
        env:
          FIREBASE_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          ACK: ${{ github.event.inputs.pii_scan_verified }}
          METHOD: ${{ steps.auth.outputs.method }}
          INTRODUCED: ${{ steps.pubread.outputs.introduced }}
        run: |
          set -euo pipefail
          if [ "$METHOD" = "wif" ]; then
            # Application Default Credentials are present; scan for real.
            node scripts/migrate-users-private.mjs --verify
            exit 0
          fi
          # Legacy FIREBASE_TOKEN is a firebase-tools refresh token; it cannot
          # authenticate the Admin SDK, so the scan cannot read production.
          # A skipped scan is not a passed scan.
          if [ "$ACK" = "i-ran-the-scan" ]; then
            echo "::warning::PII scan skipped — maintainer asserted it was run by hand (pii_scan_verified)."
            exit 0
          fi
          if [ "$INTRODUCED" != "true" ]; then
            # The public read is already live in the ruleset this deploy
            # replaces. Blocking here cannot reduce that exposure by one
            # document — it only keeps every OTHER rule fix off production,
            # which is how #519 stranded a Storage rule fix for three weeks
            # while players could not upload a landed trick. Warn and proceed.
            # The scan still runs, and still blocks on offending>0, whenever
            # credentials allow it; and the hard block below still stands
            # unconditionally when a deploy would be the one to PUBLISH the
            # public read.
            echo "::warning::PII scan could not run — legacy FIREBASE_TOKEN cannot authenticate the Admin SDK."
            echo "::warning::Proceeding anyway: 'allow get: if true' is already live in the deployed ruleset,"
            echo "::warning::so withholding this deploy would not reduce exposure — only delay unrelated fixes."
            echo "::warning::Run the scan by hand and fix WIF:"
            echo "::warning::  GOOGLE_APPLICATION_CREDENTIALS=/path/to/sa.json node scripts/migrate-users-private.mjs --verify"
            exit 0
          fi
          echo "::error::Cannot verify production before publishing a NEW public read rule."
          echo ""
          echo "firestore.rules contains 'allow get: if true' for users/{uid}, which makes every"
          echo "public user doc world-readable. That is only safe once production is confirmed to"
          echo "carry no residual dob / fcmTokens / email fields inline — and this repo authenticates"
          echo "with the legacy FIREBASE_TOKEN, which cannot authenticate the Admin SDK, so the scan"
          echo "cannot run here."
          echo ""
          echo "Pick one:"
          echo "  A. Migrate to Workload Identity Federation (set FIREBASE_WIF_PROVIDER and"
          echo "     FIREBASE_WIF_SERVICE_ACCOUNT). The scan then runs automatically on every deploy."
          echo "  B. Run it yourself, then re-run this workflow via workflow_dispatch with"
          echo "     pii_scan_verified = i-ran-the-scan :"
          echo "       export GOOGLE_APPLICATION_CREDENTIALS=/path/to/service-account.json"
          echo "       node scripts/migrate-users-private.mjs --verify"
          echo "     Expect: 'verify: scanned=<n> offending=0'"
          exit 1

      - name: Deploy rules and indexes
        id: deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          # Only pass FIREBASE_TOKEN when WIF isn't configured — firebase-tools
          # prefers FIREBASE_TOKEN over Application Default Credentials, so
          # leaving both set silently bypasses WIF.
          FIREBASE_TOKEN: ${{ steps.auth.outputs.method == 'token' && secrets.FIREBASE_TOKEN || '' }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          # firebase-tools is pinned to the same major the repo depends on
          # (package.json: firebase-tools@^15). The deploy must hard-fail on
          # any error — no `|| true`, no `continue-on-error` — so an auth or
          # permission failure surfaces as a red job, not a silent pass.
          #
          # `storage` has no subtype — `--only storage:rules` is invalid syntax
          # and fails with "Could not find rules for the following storage
          # targets: rules". For a single-bucket project, `storage` alone
          # deploys the rules file declared in firebase.json.
          #
          # Retry loop: the legacy FIREBASE_TOKEN auth path is being sunset via
          # Google deprecation *brownouts* — short intermittent windows where a
          # still-valid token is rejected with "credentials are no longer valid"
          # (issue #394). A brownout blip can outlast a couple of seconds, so we
          # retry up to 4 times with exponential backoff (15s / 60s / 180s)
          # before giving up. The deploy is idempotent, so retrying a partially
          # applied deploy is safe. Do NOT remove this without fixing the
          # underlying auth (WIF migration) first.
          set -euo pipefail
          BACKOFFS=(15 60 180) # sleep between attempt 1→2, 2→3, 3→4
          # Derived, not hardcoded: keeps attempts and backoffs in lockstep so
          # extending one can never index past the end of the other under set -u.
          MAX_ATTEMPTS=$(( ${#BACKOFFS[@]} + 1 ))
          attempt=1
          while :; do
            echo "Deploy attempt ${attempt}/${MAX_ATTEMPTS}..."
            if npx --yes firebase-tools@15 deploy \
              --project "$PROJECT_ID" \
              --only firestore:rules,firestore:indexes,storage \
              --non-interactive \
              --force; then
              echo "Deploy succeeded on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Deploy failed after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            sleep_for="${BACKOFFS[$((attempt - 1))]}"
            echo "Deploy attempt ${attempt} failed; sleeping ${sleep_for}s before retry..."
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "### Dry run" >> "$GITHUB_STEP_SUMMARY"
          echo "Rules validated against the emulator; deploy step skipped." >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Loud failure alerting. If ANY step in this job fails (auth, project
      # resolution, or the deploy itself) open — or update — a single tracking
      # issue so a broken rules deploy can never sit unnoticed again. Idempotent:
      # reuses the one open issue carrying the `firebase-rules-deploy-failure`
      # label instead of spamming a new issue per run.
      # ---------------------------------------------------------------------
      - name: Alert on deploy failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'firebase-rules-deploy-failure';
            // The staleness figure belongs in the TITLE, not buried in a
            // comment. #519 collected 27 identical comments under a constant
            // title while production drifted three weeks behind main; a title
            // that visibly counts up is the difference between an issue you
            // scroll past in the list and one you open.
            const daysStale = '${{ steps.last.outputs.days_stale }}';
            const title = daysStale
              ? `🚨 Firebase rules deploy FAILED — production ${daysStale} day(s) behind main`
              : '🚨 Firebase rules deploy FAILED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The **Deploy Firebase Rules** workflow failed.',
              '',
              `- Failed run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Triggered by: \`${context.eventName}\``,
              daysStale
                ? `- Production rules last deployed: **${daysStale} day(s) ago** (\`${{ steps.last.outputs.sha }}\`)`
                : '- Production rules last deployed: **unknown** — no successful deploy in the recent run window',
              '',
              'Production Firestore/Storage rules and indexes are **stale**: every rule',
              'change merged to `main` since that commit is live in the app but not in the',
              'backend. Assume any unexplained `permission-denied` or',
              '`storage/unauthorized` report is this until proven otherwise —',
              'see `docs/PERMISSION_DENIED_RUNBOOK.md`.',
              '',
              'Investigate the run logs above, then re-run the workflow once fixed.',
              '',
              '_This issue is auto-managed; it will be updated (not duplicated) on repeat failures._',
            ].join('\n');

            // Ensure the label exists (idempotent).
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: 'b60205',
                  description: 'Automated alert: Firebase rules deploy failed',
                });
              } else {
                throw e;
              }
            }

            // Find an existing open alert issue to update instead of spamming.
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body,
              });
              // Re-title on every failure so the running day count is visible
              // from the issue list without opening anything.
              await github.rest.issues.update({ ...context.repo, issue_number: number, title });
              core.notice(`Updated existing alert issue #${number}.`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
              core.notice(`Opened alert issue #${created.data.number}.`);
            }

      # ---------------------------------------------------------------------
      # Auto-resolve alerting. A successful (non-dry-run) deploy means
      # production rules are back in sync, so close any open alert issue that
      # a prior failure left behind. Without this, the brownout-induced
      # failures (issue #394) would leave a stale "FAILED" issue open even
      # after the very next scheduled run succeeds. Matches the failure step:
      # same label, same run-URL/trigger body style, idempotent (no-op when
      # no alert issue is open).
      # ---------------------------------------------------------------------
      - name: Resolve alert on deploy success
        if: ${{ steps.deploy.outcome == 'success' && github.event.inputs.dry_run != 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'firebase-rules-deploy-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The **Deploy Firebase Rules** workflow succeeded — production',
              'Firestore/Storage rules and indexes are back in sync.',
              '',
              `- Successful run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Triggered by: \`${context.eventName}\``,
              '',
              'Closing this auto-managed alert. It will reopen automatically on',
              'the next failed deploy.',
            ].join('\n');

            // Find an open alert issue left behind by a prior failure.
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed alert issue #${number} after successful deploy.`);
            } else {
              core.notice('No open alert issue to close.');
            }
