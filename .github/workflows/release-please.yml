name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # release-please reads commits since the last tag, classifies them by
      # Conventional Commit prefix (feat/fix/perf/refactor/docs), and either
      # updates an in-flight release PR or opens a new one. When that PR is
      # merged, it tags HEAD and creates a GitHub Release in a single step.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Default repo token. Known limitation: GitHub doesn't start other
          # workflows for events made with GITHUB_TOKEN, so the release PR
          # gets no CI checks (it can't satisfy branch protection without a
          # manual push) and a published release won't trigger release.yml.
          # Fix: swap in a GitHub App token (actions/create-github-app-token)
          # or a fine-grained PAT stored as a secret.
          token: ${{ secrets.GITHUB_TOKEN }}
