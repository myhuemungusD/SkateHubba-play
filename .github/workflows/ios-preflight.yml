name: iOS pre-flight
# Free ubuntu check for PRs that touch the native iOS patches. Never starts a
# Mac runner. The paid build (ios-release.yml) runs the same check first.
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ios-patches/**
      - scripts/patch-ios-spm.mjs
      - scripts/ios-preflight.mjs
      - scripts/__fixtures__/ios-preflight/**
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: ios-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:preflight
