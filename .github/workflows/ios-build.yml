name: Build iOS App
# Sanity gate for the native iOS shell: web build → cap sync ios → an
# unsigned simulator build of App.xcodeproj. Catches Swift/SPM breakage,
# plugin sync drift, and pbxproj mistakes without needing any signing
# material on the runner. Signed TestFlight builds stay in fastlane
# (`bundle exec fastlane ios beta`), which needs match + App Store Connect
# secrets and is run deliberately, not on every push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/ios-simulator-screenshots.sh'
  # PRs pay macOS minutes only when they touch the native shell itself —
  # src/** changes are covered by the push-to-main run instead.
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/ios-simulator-screenshots.sh'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator build (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        # Placeholder Firebase config — this job verifies the native build
        # chain, not runtime connectivity. Values must be non-empty so the
        # service-worker placeholder injection completes (see vite.config.ts).
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:placeholder'
          # Roll Dice stays off in the store build and in these screenshots.
          VITE_FEATURE_DICE_ENABLED: 'false'
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build (iOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Boot simulators and screenshot key screens
        run: bash .github/scripts/ios-simulator-screenshots.sh
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-screenshots
          path: ios/build/screenshots
          if-no-files-found: error
