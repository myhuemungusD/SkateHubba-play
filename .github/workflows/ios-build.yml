name: Build iOS App
# Sanity gate for the native iOS shell: web build → cap sync ios → an
# unsigned simulator build of App.xcodeproj. Catches Swift/SPM breakage,
# plugin sync drift, and pbxproj mistakes without needing any signing
# material on the runner. Signed TestFlight builds stay in fastlane
# (`bundle exec fastlane ios beta`), which needs match + App Store Connect
# secrets and is run deliberately, not on every push.
on:
  # Cost: macOS minutes bill at 10x. Manual dispatch only. The PR trigger
  # was removed 2026-10-17; the release-published and v* tag triggers were
  # removed 2026-10-19 so merging the release-please PR can never start a
  # paid macOS build. Signed TestFlight builds go through ios-release.yml (manual).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator build (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        # Placeholder Firebase config — this job verifies the native build
        # chain, not runtime connectivity. Values must be non-empty so the
        # service-worker placeholder injection completes (see vite.config.ts).
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:placeholder'
          # Roll Dice stays off in the store build and in these screenshots.
          VITE_FEATURE_DICE_ENABLED: 'false'
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Guard against the Facebook SDK (auth plugin traits)
        run: node scripts/check-ios-spm-traits.mjs
      - name: Build (iOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Privacy manifest guard tests with real plutil
        # Linux CI tests the guard with Python's plistlib; this runs the same
        # tests against Apple's own parser.
        run: npx vitest run src/__tests__/ios-privacy-manifests.test.ts
      - name: Check privacy manifests (no tracking, no Facebook SDK)
        run: node scripts/check-ios-privacy-manifests.mjs ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - name: Boot simulators and screenshot key screens
        run: bash .github/scripts/ios-simulator-screenshots.sh
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-screenshots
          path: ios/build/screenshots
          if-no-files-found: error
