name: iOS TestFlight
# Manual only. Signs with the certificate the bootstrap workflow stored,
# then uploads to TestFlight. Does not create certificates (match is
# readonly) and does not wait for Apple to finish processing the build.
# Run this from the Actions tab after docs/IOS_RELEASE.md. The first step
# lists every missing secret and stops before npm, signing, or upload.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shoppers see, such as 1.1.0. Leave blank to use package.json."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Sign and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Apple signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          names=(
            ASC_KEY_ID
            ASC_ISSUER_ID
            ASC_KEY_P8
            MATCH_PASSWORD
            MATCH_GIT_BASIC_AUTHORIZATION
            APPLE_TEAM_ID
          )
          if [[ ! -f ios/App/App/GoogleService-Info.plist ]]; then
            names+=(GOOGLE_SERVICE_INFO_PLIST_BASE64)
          fi
          names+=(
            VITE_APP_URL
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_VAPID_KEY
          )
          bash .github/scripts/require-github-secrets.sh "${names[@]}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: node .github/scripts/install-google-service-info.mjs

      - name: Build web assets
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # App Review must see Sign in with Apple. Enable the Firebase provider
          # first (docs/IOS_RELEASE.md). The website and Android stay off until
          # VITE_FEATURE_APPLE_SIGNIN_ENABLED is the literal "true" in Vercel.
          VITE_FEATURE_APPLE_SIGNIN_ENABLED: "true"
          # Roll Dice stays off. Do not turn this into a secret that can flip it on.
          VITE_FEATURE_DICE_ENABLED: "false"
          VITE_FEATURE_EXTRAS_ENABLED: "false"
          # Store builds must fail when the service worker would ship with
          # unreplaced Firebase placeholders (see vite.config.ts).
          REQUIRE_SW_CONFIG: "1"
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show Xcode
        run: xcodebuild -version

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Match, build, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_KEYCHAIN_NAME: skatehubba-ci
          MATCH_READONLY: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ inputs.version }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_DONT_STORE_PASSWORD: "1"
        run: |
          set -euo pipefail
          # Ephemeral keychain password for this runner only. It is not the
          # match passphrase, and it is not printed.
          export MATCH_KEYCHAIN_PASSWORD
          MATCH_KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          bundle exec fastlane ios beta
