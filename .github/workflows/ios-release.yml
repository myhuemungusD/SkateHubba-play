name: iOS TestFlight
# Manual only. Signs with the certificate the bootstrap workflow stored,
# then uploads to TestFlight. Does not create certificates (match is
# readonly) and does not wait for Apple to finish processing the build.
# Run this from the Actions tab after docs/IOS_RELEASE.md. The first step
# lists every missing secret and stops before npm, signing, or upload.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shoppers see, such as 1.1.0. Leave blank to use package.json."
        required: false
        type: string
        default: ""
      clip_editor:
        description: "Tester build: show the clip editor (VITE_FEATURE_CLIP_EDITOR). Leave off for App Store builds."
        required: false
        type: boolean
        default: false
      dice:
        description: "Tester build: show Roll Dice (VITE_FEATURE_DICE_ENABLED). Server stays gated by DICE_ENABLED / DICE_TESTER_UIDS. Leave off for App Store builds."
        required: false
        type: boolean
        default: false
      pro_camera:
        description: "Tester build: new pro camera (VITE_FEATURE_PRO_CAMERA). Leave off for App Store builds."
        required: false
        type: boolean
        default: false
      wtt:
        description: "Tester build: What's That Trick (VITE_FEATURE_WTT_ENABLED + VITE_FEATURE_FEED_MODES_ENABLED). Server stays gated by WTT_ENABLED / WTT_TESTER_UIDS. Leave off for App Store builds."
        required: false
        type: boolean
        default: false
      profile_banner:
        description: "Tester build: profile background picture (VITE_FEATURE_PROFILE_BANNER). Leave off for App Store builds."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  preflight:
    name: iOS pre-flight (free Linux check)
    # Catches broken native patches before we pay for a Mac (scripts/ios-preflight.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-flight native patches
        run: npm run ios:preflight

  testflight:
    name: Sign and upload to TestFlight
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Apple signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          names=(
            ASC_KEY_ID
            ASC_ISSUER_ID
            ASC_KEY_P8
            MATCH_PASSWORD
            MATCH_GIT_BASIC_AUTHORIZATION
            APPLE_TEAM_ID
          )
          if [[ ! -f ios/App/App/GoogleService-Info.plist ]]; then
            names+=(GOOGLE_SERVICE_INFO_PLIST_BASE64)
          fi
          names+=(
            VITE_APP_URL
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )
          # VAPID is web-push only (src/services/fcm.ts no-ops without it);
          # the native app uses APNs, so a missing key only warns.
          if [[ -z "${VITE_FIREBASE_VAPID_KEY:-}" ]]; then
            echo "::warning::VITE_FIREBASE_VAPID_KEY is not set; web push stays off in this build."
          fi
          bash .github/scripts/require-github-secrets.sh "${names[@]}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: node .github/scripts/install-google-service-info.mjs

      - name: Build web assets
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Crash reports and analytics, same as the website, so tester-build
          # crashes show up in Sentry. Both no-op when the secret is unset.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          # Every other VITE_FEATURE_* flag (map/check-ins, clips, closet,
          # Closet Studio, 360 shoes, pro/admin tools, XP, spot chats, runner...)
          # is left unset on purpose: default-off for the public, and
          # src/lib/featureFlags.ts flagOn() turns each one on at runtime for
          # uids in config/featureTesters. The code is always compiled in, so
          # leave the tester inputs below unticked for a tester build.
          # App Review must see Sign in with Apple. Enable the Firebase provider
          # first (docs/IOS_RELEASE.md). The website and Android stay off until
          # VITE_FEATURE_APPLE_SIGNIN_ENABLED is the literal "true" in Vercel.
          VITE_FEATURE_APPLE_SIGNIN_ENABLED: "true"
          # Roll Dice is off unless the person dispatching ticks the "dice"
          # input for a tester build. Do not turn this into a secret.
          VITE_FEATURE_DICE_ENABLED: ${{ inputs.dice && 'true' || 'false' }}
          # Clip editor: off unless the "clip_editor" input is ticked.
          VITE_FEATURE_CLIP_EDITOR: ${{ inputs.clip_editor && 'true' || 'false' }}
          # Wave 1 tester inputs: each off unless its box is ticked.
          VITE_FEATURE_PRO_CAMERA: ${{ inputs.pro_camera && 'true' || 'false' }}
          # Name It lives inside the feed-mode toggle, so wtt turns both on.
          VITE_FEATURE_WTT_ENABLED: ${{ inputs.wtt && 'true' || 'false' }}
          VITE_FEATURE_FEED_MODES_ENABLED: ${{ inputs.wtt && 'true' || 'false' }}
          VITE_FEATURE_PROFILE_BANNER: ${{ inputs.profile_banner && 'true' || 'false' }}
          VITE_FEATURE_EXTRAS_ENABLED: "false"
          # Map stays off for the public, but testers get every flag through the
          # config/featureTesters override, so the build needs the map key or
          # their Map tab opens to "Map is temporarily unavailable".
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_MAPBOX_STYLE_URL: ${{ secrets.VITE_MAPBOX_STYLE_URL }}
          # Pro blessing UI. The proBlessing function still gates who can act
          # (PRO_BLESSING_ENABLED / PRO_BLESSING_TESTER_UIDS, docs/PRO_BLESSING.md).
          VITE_FEATURE_PRO_BLESSING: "true"
          # Pro showcase on for everyone (Bryan + Mike granted 2026-10-16).
          VITE_FEATURE_PRO_PROFILES: "true"
          # Store builds must fail when the service worker would ship with
          # unreplaced Firebase placeholders (see vite.config.ts).
          REQUIRE_SW_CONFIG: "1"
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show Xcode
        run: xcodebuild -version

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Match, build, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_KEYCHAIN_NAME: skatehubba-ci
          MATCH_READONLY: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ inputs.version }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_DONT_STORE_PASSWORD: "1"
        run: |
          set -euo pipefail
          # Ephemeral keychain password for this runner only. It is not the
          # match passphrase, and it is not printed.
          export MATCH_KEYCHAIN_PASSWORD
          MATCH_KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          bundle exec fastlane ios beta
