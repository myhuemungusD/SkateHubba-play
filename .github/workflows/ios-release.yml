name: iOS TestFlight
# Manual only. Signs with the certificate the bootstrap workflow stored,
# then uploads to TestFlight. Does not create certificates (match is
# readonly) and does not wait for Apple to finish processing the build.
# Run this from the Actions tab after docs/IOS_RELEASE.md. The first step
# lists every missing secret and stops before npm, signing, or upload.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shoppers see, such as 1.1.0. Leave blank to use package.json."
        required: false
        type: string
        default: ""
      wtt:
        description: "Tester build: What's That Trick (VITE_FEATURE_WTT_ENABLED + VITE_FEATURE_FEED_MODES_ENABLED). Server stays gated by WTT_ENABLED / WTT_TESTER_UIDS. Leave off for App Store builds."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  preflight:
    name: iOS pre-flight (free Linux check)
    # Catches broken native patches before we pay for a Mac (scripts/ios-preflight.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-flight native patches
        run: npm run ios:preflight

  testflight:
    name: Sign and upload to TestFlight
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Apple signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          names=(
            ASC_KEY_ID
            ASC_ISSUER_ID
            ASC_KEY_P8
            MATCH_PASSWORD
            MATCH_GIT_BASIC_AUTHORIZATION
            APPLE_TEAM_ID
          )
          if [[ ! -f ios/App/App/GoogleService-Info.plist ]]; then
            names+=(GOOGLE_SERVICE_INFO_PLIST_BASE64)
          fi
          names+=(
            VITE_APP_URL
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )
          # VAPID is web-push only (src/services/fcm.ts no-ops without it);
          # the native app uses APNs, so a missing key only warns.
          if [[ -z "${VITE_FIREBASE_VAPID_KEY:-}" ]]; then
            echo "::warning::VITE_FIREBASE_VAPID_KEY is not set; web push stays off in this build."
          fi
          bash .github/scripts/require-github-secrets.sh "${names[@]}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: node .github/scripts/install-google-service-info.mjs

      - name: Build web assets
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Crash reports and analytics, same as the website, so tester-build
          # crashes show up in Sentry. Both no-op when the secret is unset.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          # Public App Store flags (2026-10-20: every finished feature is on
          # for everyone so the binary matches the listing and screenshots).
          # Each server switch is on too (functions params), so no screen
          # shows a button the server refuses.
          # Still off for the public (testers see them via config/featureTesters):
          #   pro blessing UI (website only for now), Skate Runner (until Jason
          #   signs off), What's That Trick (scoring not built), buying Hubba
          #   Bucks (needs App Store in-app purchase products), SMS two-step
          #   (not built for iPhone), admin screens (admin claim only).
          VITE_FEATURE_APPLE_SIGNIN_ENABLED: "true"
          VITE_FEATURE_EXTRAS_ENABLED: "true"
          VITE_FEATURE_MAP_CHECKINS: "true"
          VITE_FEATURE_SPOT_PRESENCE: "true"
          VITE_FEATURE_TIPS: "true"
          # Pro blessing UI off on iPhone for launch (Jason, 2026-10-21).
          VITE_FEATURE_PRO_BLESSING: "false"
          VITE_FEATURE_PRO_PROFILES: "true"
          VITE_FEATURE_PRO_SHOWCASE: "true"
          VITE_FEATURE_PRO_CALLS: "true"
          VITE_FEATURE_PRO_COMMUNITY: "true"
          VITE_FEATURE_DICE_ENABLED: "false"
          VITE_FEATURE_XP_ENABLED: "true"
          VITE_FEATURE_REFEREE_ENABLED: "true"
          VITE_FEATURE_TURN_LENGTH: "true"
          VITE_FEATURE_TRICK_PICKER_ENABLED: "true"
          VITE_FEATURE_CLIP_EDITOR: "true"
          VITE_FEATURE_PRO_CAMERA: "true"
          VITE_FEATURE_CLIP_MODERATION_ENABLED: "true"
          VITE_FEATURE_FEED_MODES_ENABLED: "true"
          VITE_FEATURE_POST_MAKES_ENABLED: "true"
          VITE_FEATURE_PROFILE_BANNER: "true"
          VITE_FEATURE_PROFILE_CUSTOM: "true"
          VITE_FEATURE_SPOT_CHATS_ENABLED: "true"
          VITE_FEATURE_CLOSET_ENABLED: "true"
          VITE_FEATURE_CLOSET_DROPS_ENABLED: "true"
          VITE_FEATURE_CLOSET_TRADING_ENABLED: "false"
          VITE_FEATURE_CLOSET_STUDIO: "true"
          VITE_FEATURE_SHOE_360: "true"
          VITE_FEATURE_HUBBA_ICONS: "true"
          VITE_FEATURE_RUNNER_ENABLED: "false"
          VITE_FEATURE_CLOSET_BUCKS_PURCHASE_ENABLED: "false"
          VITE_FEATURE_SMS_2FA_ENABLED: "false"
          # Tester build only: What's That Trick ("wtt" input).
          VITE_FEATURE_WTT_ENABLED: ${{ inputs.wtt && 'true' || 'false' }}
          # Map key required now that Map is public (and for testers).
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_MAPBOX_STYLE_URL: ${{ secrets.VITE_MAPBOX_STYLE_URL }}
          # Store builds must fail when the service worker would ship with
          # unreplaced Firebase placeholders (see vite.config.ts).
          REQUIRE_SW_CONFIG: "1"
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show Xcode
        run: xcodebuild -version

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Match, build, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_KEYCHAIN_NAME: skatehubba-ci
          MATCH_READONLY: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ inputs.version }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_DONT_STORE_PASSWORD: "1"
        run: |
          set -euo pipefail
          # Ephemeral keychain password for this runner only. It is not the
          # match passphrase, and it is not printed.
          export MATCH_KEYCHAIN_PASSWORD
          MATCH_KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          bundle exec fastlane ios beta
