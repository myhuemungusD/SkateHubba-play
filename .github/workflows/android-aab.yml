name: Build Android AAB
on:
  workflow_dispatch: # Manual trigger - you control when this runs
    inputs:
      verbose:
        description: 'Run gradle with --info (verbose logs for debugging)'
        type: boolean
        default: false
      upload_to_play:
        description: 'Upload the built AAB to the Google Play internal track via fastlane'
        type: boolean
        default: false
  # Cost (Actions budget, 2026-10-19): manual only. The old push-to-main and
  # v* tag triggers ran a ~15-minute Android build on almost every merge.
  # Start it by hand from the Actions tab when a Play upload is needed.

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Runs before the web build so steps.version outputs are available to
      # both the VITE_APP_VERSION env below and the Gradle args later.
      - name: Resolve Android version
        id: version
        # github.ref and github.run_number are routed through env rather than
        # interpolated straight into the script: a tag push carries the tag name
        # in github.ref, and tag names can contain shell metacharacters.
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # versionCode: monotonically increasing workflow run number. Play Store
          # requires each uploaded artifact to have a unique, increasing code.
          echo "code=${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          # versionName: if this build was triggered by a v*.*.* tag, strip the
          # leading 'v' and use that. Otherwise leave empty so build.gradle
          # falls back to package.json.version.
          if [[ "$REF" == refs/tags/v* ]]; then
            NAME="${REF#refs/tags/v}"
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build web assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_MAPBOX_STYLE_URL: ${{ secrets.VITE_MAPBOX_STYLE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          # Always on in store builds: Play Integrity is free (only the website's
          # reCAPTCHA costs money). Without it the enforceAppCheck callables
          # (Closet, pro seed) reject every call. See ios-release.yml.
          VITE_APPCHECK_ENABLED: "true"
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          # Release tagging for Sentry/PostHog (APP_RELEASE in src/main.tsx).
          # Empty versionName on non-tag builds falls through to the git sha.
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
          VITE_GIT_SHA: ${{ github.sha }}
          # Public Play Store flags (compliance audit G6). Same values as
          # ios-release.yml so both stores ship the same app, minus
          # VITE_FEATURE_APPLE_SIGNIN_ENABLED (iOS only). Reasons for each
          # "false" are next to the iOS list. src/__tests__/store-build-flags.test.ts
          # fails if the two lists drift.
          VITE_FEATURE_EXTRAS_ENABLED: "true"
          VITE_FEATURE_MAP_CHECKINS: "true"
          VITE_FEATURE_SPOT_PRESENCE: "true"
          VITE_FEATURE_TIPS: "true"
          # Off in both store builds (Jason, 2026-10-21; iOS side is #817).
          VITE_FEATURE_PRO_BLESSING: "false"
          VITE_FEATURE_PRO_PROFILES: "true"
          VITE_FEATURE_PRO_SHOWCASE: "true"
          VITE_FEATURE_PRO_CALLS: "true"
          VITE_FEATURE_PRO_COMMUNITY: "true"
          VITE_FEATURE_DICE_ENABLED: "false"
          VITE_FEATURE_XP_ENABLED: "true"
          VITE_FEATURE_REFEREE_ENABLED: "true"
          VITE_FEATURE_TURN_LENGTH: "true"
          VITE_FEATURE_TRICK_PICKER_ENABLED: "true"
          VITE_FEATURE_CLIP_EDITOR: "true"
          VITE_FEATURE_PRO_CAMERA: "true"
          VITE_FEATURE_CLIP_MODERATION_ENABLED: "true"
          VITE_FEATURE_FEED_MODES_ENABLED: "true"
          VITE_FEATURE_POST_MAKES_ENABLED: "true"
          VITE_FEATURE_PROFILE_BANNER: "true"
          VITE_FEATURE_PROFILE_CUSTOM: "true"
          VITE_FEATURE_SPOT_CHATS_ENABLED: "true"
          # Closet stays off in store builds until claim, buy and equip are
          # verified on a TestFlight build with App Check (iOS side is #829).
          # Closet Studio (its clothes editor) goes with it.
          VITE_FEATURE_CLOSET_ENABLED: "false"
          VITE_FEATURE_CLOSET_DROPS_ENABLED: "false"
          VITE_FEATURE_CLOSET_TRADING_ENABLED: "false"
          VITE_FEATURE_CLOSET_STUDIO: "false"
          VITE_FEATURE_SHOE_360: "true"
          VITE_FEATURE_HUBBA_ICONS: "true"
          VITE_FEATURE_RUNNER_ENABLED: "false"
          VITE_FEATURE_CLOSET_BUCKS_PURCHASE_ENABLED: "false"
          VITE_FEATURE_SMS_2FA_ENABLED: "false"
          # "Find me a challenger" on Home stays off (button hidden).
          VITE_FEATURE_RANDOM_CHALLENGER: "false"
          # iOS turns this on only for tester builds (its "wtt" input).
          VITE_FEATURE_WTT_ENABLED: "false"
          # Store builds must fail, not warn, when the service-worker Firebase
          # config would ship with unreplaced placeholders (see vite.config.ts).
          REQUIRE_SW_CONFIG: '1'
      - name: Sync Capacitor
        run: npx cap sync android
      # Without android/app/google-services.json, build.gradle skips the
      # google-services plugin and Android push never registers. Same
      # pattern as ios-release.yml's GoogleService-Info.plist step.
      - name: Install google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: node .github/scripts/install-google-services-json.mjs
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        # The action's historic default included the retired SDK package `tools`.
        # Request only the current platform tools; Gradle resolves the platform
        # and build-tools versions declared by the Android project.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/skatehubba-upload.keystore
      - name: Build signed AAB
        working-directory: android
        # All dynamic values (version outputs, signing secrets, workspace path)
        # are surfaced as env vars instead of being interpolated into the script,
        # keeping tag-derived values and secrets out of the command text.
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          # Deliberately NOT named KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/
          # KEY_PASSWORD: build.gradle reads those env names as a signing
          # source of its own, and CI should have exactly one live source —
          # the -Pandroid.injected.signing.* properties below.
          SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/skatehubba-upload.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERBOSE: ${{ inputs.verbose }}
        run: |
          GRADLE_ARGS=(
            bundleRelease
            -PversionCode="${VERSION_CODE}"
            -Pandroid.injected.signing.store.file="${SIGNING_STORE_FILE}"
            -Pandroid.injected.signing.store.password="${SIGNING_STORE_PASSWORD}"
            -Pandroid.injected.signing.key.alias="${SIGNING_KEY_ALIAS}"
            -Pandroid.injected.signing.key.password="${SIGNING_KEY_PASSWORD}"
          )
          if [ -n "${VERSION_NAME}" ]; then
            GRADLE_ARGS+=(-PversionName="${VERSION_NAME}")
          fi
          # --stacktrace is cheap and surfaces the failing task + cause
          # on any failure. --info is opt-in via workflow_dispatch because
          # it produces tens of thousands of lines per build — useful for
          # debugging, harmful as default noise on every push to main.
          GRADLE_ARGS+=(--stacktrace)
          if [ "${VERBOSE}" = "true" ]; then
            GRADLE_ARGS+=(--info)
          fi
          ./gradlew "${GRADLE_ARGS[@]}"
      - name: Upload AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skatehubba-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      # Optional Play Store publish — manual dispatch only. Reuses the AAB
      # built above via the upload-only fastlane lane (no second Gradle run),
      # so the artifact attached to the workflow and the one on the internal
      # track are byte-identical.
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        if: inputs.upload_to_play == true
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Upload to Google Play internal track
        if: inputs.upload_to_play == true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android publish_internal
