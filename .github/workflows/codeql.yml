name: CodeQL

# Static analysis (SAST) for the app, the api/ serverless endpoints, the
# functions/ package, scripts, and the workflows themselves. Results land in
# Security → Code scanning. Not a required check yet: let it run for a while,
# triage the first batch of alerts, then consider requiring it (or a code
# scanning merge-protection rule) on main.

on:
  # Cost: main pushes + weekly schedule only (not every PR). Not a required
  # check, so dropping the PR trigger blocks nothing.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    # Weekly re-scan so new CodeQL queries run against unchanged code.
    # Mondays 07:27 UTC, off the top of the hour.
    - cron: "27 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers src/, api/, functions/, e2e/ and
        # scripts/*.mjs. actions covers .github/workflows and the composite
        # action. python covers scripts/*.py. Java/Kotlin and Swift are thin
        # Capacitor shells and would need full native builds; left out.
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage
              - android/app/build
              - ios/App/build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
