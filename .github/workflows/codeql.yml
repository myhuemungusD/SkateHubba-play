name: CodeQL

# Static analysis (SAST) for the app, the api/ serverless endpoints, the
# functions/ package, scripts, and the workflows themselves. Results land in
# Security → Code scanning when code scanning is enabled for the repo. This
# repo is private without GitHub Code Security, so the upload API refuses
# results ("Code scanning is not enabled"); the job then keeps the SARIF as a
# run artifact and writes a findings summary instead of failing. Not a required check yet: let it run for a while,
# triage the first batch of alerts, then consider requiring it (or a code
# scanning merge-protection rule) on main.

on:
  # Cost: weekly schedule + manual only (approved by Jason 2026-10-20). Not a
  # required check, and on this private repo the results can't upload to Code
  # scanning anyway, so a run on every main push bought nothing extra.
  schedule:
    # Weekly re-scan so new CodeQL queries run against unchanged code.
    # Mondays 07:27 UTC, off the top of the hour.
    - cron: "27 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers src/, api/, functions/, e2e/ and
        # scripts/*.mjs. actions covers .github/workflows and the composite
        # action. python covers scripts/*.py. Java/Kotlin and Swift are thin
        # Capacitor shells and would need full native builds; left out.
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether code scanning is enabled
        id: scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" >/dev/null 2>&1; then
            echo "upload=always" >> "$GITHUB_OUTPUT"
          else
            echo "upload=never" >> "$GITHUB_OUTPUT"
            echo "::notice::Code scanning is not enabled for this repo; SARIF is kept as an artifact."
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage
              - android/app/build
              - ios/App/build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ steps.scanning.outputs.upload }}
          output: sarif-results

      - name: Summarize findings
        if: steps.scanning.outputs.upload == 'never'
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' sarif-results/*.sarif)
          echo "### CodeQL (${{ matrix.language }}): ${count} finding(s)" >> "$GITHUB_STEP_SUMMARY"
          jq -rs '[.[].runs[].results[]] | .[:50][] | "- \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif-results/*.sarif >> "$GITHUB_STEP_SUMMARY"

      - name: Keep SARIF
        if: steps.scanning.outputs.upload == 'never'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results
          retention-days: 30
