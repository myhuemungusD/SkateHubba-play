name: Deploy Firebase Functions

# Manual Cloud Functions deploy. Never runs on push.
#
# Actions → Deploy Firebase Functions → Run workflow.
# Type `deploy` in `confirm`. Leave `functions` empty to deploy every export,
# or pass a comma-separated list such as `diceAction,diceSweep`.
#
# Setup, IAM, and the parameter file: docs/DEPLOY_FUNCTIONS.md.
#
# Auth matches `.github/workflows/firebase-rules-deploy.yml`:
#   Workload Identity Federation (`FIREBASE_WIF_PROVIDER` +
#   `FIREBASE_WIF_SERVICE_ACCOUNT`) via google-github-actions/auth, with
#   id-token: write. If WIF is missing or the token exchange fails, fall
#   back to the legacy `FIREBASE_TOKEN`. Project id comes from
#   `FIREBASE_PROJECT_ID`, then `.firebaserc`. Same `production` environment.
#
# `--force` is only here so `--non-interactive` can answer the Artifact
# Registry cleanup-policy prompt (keep container images for 1 day, the CLI
# default). This repo's `onGameCompleted` export also sets `retry: true`,
# and a non-interactive deploy refuses that failure policy unless `--force`
# is set. Side effect: a full deploy (empty `functions` input) deletes any
# Cloud Function that is no longer exported from `functions/src`. A named
# list updates only those functions.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Comma-separated function names (diceAction,diceSweep). Empty deploys all."
        required: false
        default: ""
        type: string
      confirm:
        description: "Type deploy to upload Cloud Functions to production."
        required: true
        type: string

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm deploy
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Refusing to deploy. The confirm input must be the word deploy."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch. It deploys whatever branch is selected."
            exit 1
          fi

      - name: Resolve function list
        id: targets
        env:
          FUNCTIONS: ${{ github.event.inputs.functions }}
        run: |
          set -euo pipefail
          RAW="${FUNCTIONS// /}"
          if [ -z "$RAW" ]; then
            echo "only=functions" >> "$GITHUB_OUTPUT"
            echo "Deploy target: all functions."
            exit 0
          fi
          if ! [[ "$RAW" =~ ^[A-Za-z][A-Za-z0-9]*(,[A-Za-z][A-Za-z0-9]*)*$ ]]; then
            echo "::error::The functions input must be a comma-separated list of names, like diceAction,diceSweep."
            exit 1
          fi
          echo "only=functions:${RAW}" >> "$GITHUB_OUTPUT"
          echo "Deploy target: ${RAW}."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Test functions
        working-directory: functions
        run: npm test

      - name: Resolve Firebase project
        id: project
        run: |
          set -euo pipefail
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID secret is empty — falling back to .firebaserc"
            PROJECT_ID=$(jq -r '.projects.default // empty' .firebaserc)
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Cannot resolve Firebase project ID."
            echo "Set the FIREBASE_PROJECT_ID secret, or add a default project to .firebaserc."
            exit 1
          fi
          if ! [[ "$PROJECT_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Refusing to use an unexpected Firebase project id."
            exit 1
          fi
          echo "Resolved project: $PROJECT_ID"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Write function parameters
        env:
          FUNCTIONS_DOTENV: ${{ secrets.FUNCTIONS_DOTENV }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          if [ -z "$FUNCTIONS_DOTENV" ]; then
            echo "::error::FUNCTIONS_DOTENV secret is empty."
            echo "Put the contents of functions/.env.${PROJECT_ID} in that secret."
            echo "See docs/DEPLOY_FUNCTIONS.md."
            exit 1
          fi
          umask 077
          DEST="functions/.env.${PROJECT_ID}"
          printf '%s\n' "$FUNCTIONS_DOTENV" > "$DEST"
          missing=0
          for key in XP_ENABLED XP_TESTER_UIDS DICE_ENABLED DICE_TESTER_UIDS MODERATION_ENABLED SENTRY_DSN PRO_BLESSING_ENABLED PRO_BLESSING_TESTER_UIDS PRO_BLESSING_LIMIT PRO_BLESSING_WINDOW_DAYS PRO_BLESSING_MIN_ACCOUNT_DAYS; do
            if ! grep -Eq "^${key}=" "$DEST"; then
              echo "::error::FUNCTIONS_DOTENV is missing ${key}=. Use KEY=value lines, with no export prefix."
              missing=1
            fi
          done
          for key in XP_ENABLED DICE_ENABLED MODERATION_ENABLED PRO_BLESSING_ENABLED; do
            val=$(grep -E "^${key}=" "$DEST" | head -n 1 | cut -d= -f2- | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' || true)
            if [ "$val" != "true" ] && [ "$val" != "false" ]; then
              echo "::error::${key} must be true or false."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            rm -f "$DEST"
            exit 1
          fi
          # Mask longer values (uids, DSNs) so a later CLI log line cannot
          # echo them. Short values like true/false stay readable.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            val="${line#*=}"
            if [ "${#val}" -ge 8 ]; then
              escaped=$(printf '%s' "$val" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::add-mask::${escaped}"
            fi
          done < "$DEST"
          echo "Wrote function parameters for ${PROJECT_ID}. Values were not printed."

      - name: Detect available credentials
        id: creds
        env:
          WIF_PROVIDER: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_WIF_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Secrets must be surfaced via env first — referencing `secrets.*`
          # directly in step-level `if:` expressions evaluates to null at
          # validation time (documented GH Actions quirk), so a "gate" written
          # that way is always-on and never actually gates.
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            if ! [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
              echo "::error::FIREBASE_WIF_PROVIDER is invalid. Expected: projects/NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID"
              echo "Expected full resource name format:"
              echo "projects/123456789/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID"
              echo "Fix FIREBASE_WIF_PROVIDER in GitHub → Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "method=wif" >> "$GITHUB_OUTPUT"
            echo "Using Workload Identity Federation."
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "Using legacy FIREBASE_TOKEN. Migrate to WIF when convenient."
          else
            echo "::error::No Firebase credentials available."
            echo "Set FIREBASE_WIF_PROVIDER + FIREBASE_WIF_SERVICE_ACCOUNT (preferred),"
            echo "or FIREBASE_TOKEN (legacy) in GitHub → Settings → Secrets."
            exit 1
          fi

      # A WIF failure is NOT fatal on its own. Same fallback as the rules
      # deploy: a provider GCP cannot resolve must not block the upload while
      # FIREBASE_TOKEN is still set.
      - name: Authenticate via Workload Identity Federation
        id: wif
        if: steps.creds.outputs.method == 'wif'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_WIF_SERVICE_ACCOUNT }}

      - name: Resolve effective auth method
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PREFERRED: ${{ steps.creds.outputs.method }}
          WIF_OUTCOME: ${{ steps.wif.outcome }}
        run: |
          set -euo pipefail
          if [ "$PREFERRED" = "wif" ] && [ "$WIF_OUTCOME" = "success" ]; then
            echo "method=wif" >> "$GITHUB_OUTPUT"
            echo "Authenticated via Workload Identity Federation."
            exit 0
          fi
          if [ "$PREFERRED" = "wif" ]; then
            echo "::warning::WIF authentication FAILED — the Google error is in the step above."
            echo "::warning::FIREBASE_WIF_PROVIDER must be the full resource name of a provider that exists."
            echo "::warning::Read the correct value straight from GCP rather than composing it by hand:"
            echo "::warning::  gcloud iam workload-identity-pools providers describe PROVIDER_ID \\"
            echo "::warning::    --location=global --workload-identity-pool=POOL_ID --format='value(name)'"
            echo "::warning::The project segment is the project NUMBER, not the project ID."
          fi
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_APPLICATION_CREDENTIALS=" >> "$GITHUB_ENV"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> "$GITHUB_ENV"
            echo "::warning::Falling back to the legacy FIREBASE_TOKEN so the deploy still ships."
            exit 0
          fi
          echo "::error::No usable Firebase credentials — WIF failed and FIREBASE_TOKEN is unset."
          exit 1

      - name: Deploy functions
        env:
          # Only pass FIREBASE_TOKEN when WIF isn't the method that actually
          # authenticated — firebase-tools prefers FIREBASE_TOKEN over
          # Application Default Credentials, so leaving both set skips WIF.
          FIREBASE_TOKEN: ${{ steps.auth.outputs.method == 'token' && secrets.FIREBASE_TOKEN || '' }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          ONLY: ${{ steps.targets.outputs.only }}
        run: |
          # firebase-tools is pinned to the same major the repo depends on
          # (package.json: firebase-tools@^15), matching firebase-rules-deploy.yml.
          #
          # firebase.json predeploy runs `npm ci` and `npm run build` in
          # functions/ again before the upload. The test step above is what
          # stops a failing suite from reaching this command.
          #
          # Retry loop: the legacy FIREBASE_TOKEN path is sunset via Google
          # deprecation brownouts (same reason as the rules workflow). The
          # deploy is idempotent for functions that are still exported.
          set -euo pipefail
          BACKOFFS=(15 60 180)
          MAX_ATTEMPTS=$(( ${#BACKOFFS[@]} + 1 ))
          attempt=1
          while :; do
            echo "Deploy attempt ${attempt}/${MAX_ATTEMPTS} (--only ${ONLY})..."
            if npx --yes firebase-tools@15 deploy \
              --project "$PROJECT_ID" \
              --only "$ONLY" \
              --non-interactive \
              --force; then
              echo "Deploy succeeded on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Deploy failed after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            sleep_for="${BACKOFFS[$((attempt - 1))]}"
            echo "Deploy attempt ${attempt} failed; sleeping ${sleep_for}s before retry..."
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

      - name: Summary
        env:
          ONLY: ${{ steps.targets.outputs.only }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          METHOD: ${{ steps.auth.outputs.method }}
        run: |
          {
            echo "### Cloud Functions deploy"
            echo ""
            echo "- Project: \`${PROJECT_ID}\`"
            echo "- Target: \`${ONLY}\`"
            echo "- Auth: \`${METHOD}\`"
          } >> "$GITHUB_STEP_SUMMARY"
