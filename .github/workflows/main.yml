name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review re-runs the gated jobs when a draft PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly schedule removed 2026-10-17 (Actions cost, approved by Jason).
  # audit-nightly now runs only on manual dispatch; Dependabot alerts still
  # cover new advisories against main's lockfiles.
  # Manual smoke-test hook for audit-nightly: schedule-triggered jobs only
  # fire from the workflow file on the default branch, so this is the only
  # way to exercise that job before (or without) waiting for the cron.
  # Dispatch runs are audit-only unless the "lighthouse" input is ticked.
  # Note: workflow_dispatch runs the workflow DEFINITION from whatever branch
  # is selected in the UI (only the checkout below is pinned to main). If
  # audit-nightly's step list is being edited on a feature branch, dispatch
  # from that branch to test the pending changes, but expect the audit itself
  # to run against main's lockfile — that pinning is intentional (see below).
  workflow_dispatch:
    inputs:
      lighthouse:
        description: "Also build the app and run Lighthouse (the speed check). Off = dependency audit only."
        type: boolean
        default: false

# Least-privilege baseline: read-only across the workflow. Each job that
# genuinely needs to write (e.g. lighthouse posting statuses/PR comments)
# escalates explicitly under its own `permissions:` block. Especially
# relevant for the unattended `audit-nightly` cron below, which runs
# `npm ci` (arbitrary postinstall scripts) on a schedule against main —
# a malicious transitive must not inherit a write-scoped GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  # event_name is part of the group so a scheduled run on refs/heads/main can
  # never cancel (or be cancelled by) an in-flight push run on the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cost gate (Actions budget). Required checks can't use workflow-level
  # paths-ignore — a workflow that never starts leaves build-and-test / e2e
  # "pending" forever and blocks merge. Instead this cheap job decides, and the
  # heavy jobs are *skipped* (a skipped required check counts as passing).
  # Skips: draft PRs, and changes that only touch docs / markdown.
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect non-docs changes
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual Lighthouse run — building."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
            echo "Draft PR — skipping heavy jobs until ready_for_review."
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || git diff --name-only "$BASE" "$HEAD")
          # functions/ is skipped here too: pr-gate.yml's "Build and test Cloud
          # Functions" job covers it, and the web build never imports it.
          if [ -z "$files" ] || echo "$files" | grep -qvE '(\.md$|^docs/|^design/|^functions/|^LICENSE|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change — skipping heavy jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    # Scheduled + manually dispatched runs are audit-only — skipping this job
    # also skips e2e and lighthouse via their `needs` edges. Draft and
    # docs-only changes are skipped too (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the dependency-change detection below can diff
          # against the PR base / previous push head (same requirement as the
          # merge-base diffs in pr-gate.yml).
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Restored after `npm ci` (which wipes node_modules). Holds the tsc -b
      # incremental .tsBuildInfo files and Vite/Vitest caches so warm runs
      # only re-check what changed.
      - name: Cache TypeScript / Vite build state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/.tmp
            node_modules/.vite
          key: build-state-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-state-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # ── Dependency audit, scoped to what this change can control ──
      # History: the audit used to run unconditionally as a hard gate, which
      # meant every advisory published against an EXISTING pinned transitive
      # instantly broke every open PR — including PRs that never touched a
      # dependency (two consecutive days of this in 2026-07 forced hand-bumps
      # into unrelated PRs). Policy now:
      #   • change touches package.json / package-lock.json → audit BLOCKS
      #     (nobody can introduce a vulnerable dep),
      #   • change doesn't touch deps → audit still runs, report-only
      #     (signal preserved, PR not held hostage for drift it can't fix),
      #   • drift itself is caught by the daily audit-nightly job below +
      #     Dependabot PRs.
      # Detection fails SAFE on BOTH event paths: any state where the diff
      # range can't be resolved (forced push, missing before-SHA, git error)
      # treats deps as changed so the blocking audit runs.
      - name: Detect dependency manifest changes
        id: deps
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}...HEAD"
          else
            if [ -z "$BEFORE_SHA" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              echo "::warning::Cannot resolve previous head (before-SHA missing or unknown to this clone) — failing safe: treating deps as changed so the blocking audit runs."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="${BEFORE_SHA}..HEAD"
          fi
          # `if !` keeps set -e from killing the step; a git error must land
          # in the fail-safe branch, not silently select report-only mode.
          if ! CHANGED_FILES=$(git diff --name-only "$RANGE" -- package.json package-lock.json); then
            echo "::warning::git diff failed for range $RANGE — failing safe: treating deps as changed so the blocking audit runs."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit dependencies (blocking — this change touches deps)
        if: steps.deps.outputs.changed == 'true'
        run: |
          npm audit --audit-level=moderate

      - name: Audit dependencies (report-only — deps untouched by this change)
        if: steps.deps.outputs.changed != 'true'
        run: |
          if ! npm audit --audit-level=moderate; then
            echo "::warning::npm audit found advisories in existing pinned dependencies. This change does not touch package.json/package-lock.json, so it is not blocked. Drift is handled by the nightly audit job and Dependabot."
          fi

      - name: Guard against as-any in production code
        run: |
          if grep -rn "as any" src/ --include="*.ts" --include="*.tsx" | grep -v __tests__ | grep -v __mocks__ | grep -v ".test."; then
            echo "::error::'as any' found in production code. Keep type casts in test files only."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Scan test files for duplicated blocks
        # Mirrors the pr-gate.yml job. Without this, a PR that slips past the
        # gate (e.g. via merge ordering) leaves main green while every later PR
        # inherits the failure on its first sync from main.
        run: node scripts/check-test-duplication.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:placeholder"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: dist/
          retention-days: 7

  e2e:
    needs: build-and-test
    # Manual Lighthouse dispatches build the app but don't need e2e.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Firebase emulator binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        id: e2e_run
        continue-on-error: true
        # `shell: bash -eo pipefail {0}` is load-bearing. GitHub's default for
        # `run:` is `bash -e {0}` — NO pipefail — so the exit status of
        # `npm run test:e2e | tee` is tee's, which is always 0. This step's
        # outcome was therefore always 'success', the "Fail if E2E tests
        # failed" gate below never fired, and a red E2E suite reported green.
        # Same reason the cron workflows pin it on their `curl | tee` steps.
        shell: bash -eo pipefail {0}
        run: npm run test:e2e 2>&1 | tee e2e-output.log

      - name: Dump E2E output to summary
        if: always()
        run: |
          echo "### E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'passed|failed|timed out|Error|FAIL|PASS|\[diag\]|timeout|✓|✘|›' e2e-output.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No relevant output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 150 lines" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -150 e2e-output.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if E2E tests failed
        if: steps.e2e_run.outcome == 'failure'
        run: exit 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-output.log
          retention-days: 14

  lighthouse:
    needs: build-and-test
    # Cost (Actions budget, 2026-10-19): manual only. Not a required check, and
    # 3 runs x 3 URLs on every PR and every main push burned minutes for no
    # merge signal. Run it from Actions → CI → Run workflow → lighthouse.
    if: github.event_name == 'workflow_dispatch' && inputs.lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # LHCI uses GITHUB_TOKEN to publish commit statuses and (when configured)
    # PR comments. Escalate above the workflow-level `contents: read` baseline
    # for just this job — every other job stays read-only.
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: dist/

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Nightly dependency-drift audit ──
  # Companion to the deps-scoped audit in build-and-test: PRs only block on
  # advisories THEY introduce; advisories published against main's existing
  # lockfile surface here instead — a red scheduled run in the Actions tab is
  # the alert, and the fix lands via Dependabot or a dedicated dep-bump PR
  # rather than being hand-patched into whatever PR happens to be open.
  # functions/ is audited too, but at --audit-level=high: it carries known
  # unfixable moderates via firebase-admin transitives (tracked upstream), so
  # auditing it at moderate would leave this job permanently red and train
  # everyone to ignore it.
  audit-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Cap the run so a hung registry doesn't burn nightly minutes toward
    # GitHub's 6-hour job default. `npm ci` + `npm audit` completes in ~1 min
    # even on cold caches; 10 minutes is comfortable headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to main so `workflow_dispatch` fired from a feature branch still
          # audits main's lockfile. Otherwise a dispatch from an outdated branch
          # would report drift against that branch's stale lockfile and either
          # cry wolf or (worse) miss a real advisory that only exists on main.
          # Schedule runs already default to main; this only affects dispatch.
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies (blocking — main lockfile drift)
        run: |
          npm audit --audit-level=moderate

      # Runs even if the root audit failed so one red night reports both.
      # `npm audit` reads the lockfile only, so no install is needed.
      - name: Audit functions dependencies (blocking on high/critical)
        if: ${{ !cancelled() }}
        working-directory: functions
        run: |
          npm audit --audit-level=high
