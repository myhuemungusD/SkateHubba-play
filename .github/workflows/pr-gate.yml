name: PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel superseded runs when a PR is pushed again, so the gate's jobs don't
  # keep running against stale commits.
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm the change arrived via pull request
        run: |
          echo "✅ PR gate passed — this change arrived via pull request."
          echo ""
          echo "Branch protection on main requires:"
          echo "  - A pull request (no direct pushes)"
          echo "  - All required status checks passing (build-and-test, e2e, PR Gate jobs)"
          echo "  - Branch is up to date with main before merge"
          echo "  - All review conversations resolved; squash merge only (linear history)"
          echo ""
          echo "See .github/BRANCH_PROTECTION.md for full ruleset."

  guard-as-any-casts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject as-any in production code
        run: |
          # Covers the app (src/), the approved Cloud Functions codebase
          # (functions/src/) and the serverless endpoints (api/), with the
          # same test-file exclusions.
          if grep -rn "as any" src/ functions/src/ api/ --include="*.ts" --include="*.tsx" | grep -v __tests__ | grep -v __mocks__ | grep -v ".test."; then
            echo "::error::'as any' found in production code. Keep type casts in test files only."
            exit 1
          fi

  verify-no-cloud-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history so `git diff origin/main...HEAD` resolves the
          # merge-base correctly. With the default shallow clone, the diff
          # can return empty and silently let new functions/src/ slip past.
          fetch-depth: 0

      - name: Enforce Cloud Functions allowlist
        run: |
          # Maintainer-approved Cloud Functions (see docs/CHARTER.md §4.14):
          #   • the stats close-out (approved 2026-07)
          #   • Roll Dice — diceAction + diceSweep (approved 2026-10). The
          #     server rolls every die; clients never write diceGames.
          # Any other changed file under functions/src/ hard-fails.
          VIOLATIONS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              functions/src/index.ts|functions/src/index.test.ts|functions/src/applyGameStats.ts|functions/src/applyGameStats.test.ts|functions/src/dice/*.ts) ;;
              *) VIOLATIONS="${VIOLATIONS}${file}"$'\n' ;;
            esac
          done < <(git diff origin/main...HEAD --name-only | grep -E '^functions/src/' || true)

          if [ -n "$VIOLATIONS" ]; then
            printf '%s' "$VIOLATIONS"
            echo "::error::Unapproved Cloud Functions source detected under functions/src/."
            echo "Only the maintainer-approved file set is allowed:"
            echo "  functions/src/index.ts"
            echo "  functions/src/index.test.ts"
            echo "  functions/src/applyGameStats.ts"
            echo "  functions/src/applyGameStats.test.ts"
            echo "  functions/src/dice/*.ts  (Roll Dice, approved 2026-10)"
            echo "Any other functions/src/ code requires explicit maintainer approval."
            echo "See .github/BRANCH_PROTECTION.md for details."
            exit 1
          fi

  guard-todo-fixme-hack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject TODO/FIXME/HACK in production code
        run: |
          MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" -E '\b(TODO|FIXME|HACK)\b' src/ api/ || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo ""
            echo "::error::TODO/FIXME/HACK comments found in src/ or api/. Resolve before merging."
            exit 1
          fi

  verify-workflow-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same merge-base requirement as verify-no-cloud-functions — without
          # full history, the diff returns empty and the warning never fires.
          fetch-depth: 0

      - name: Flag workflow file modifications
        run: |
          CHANGED=$(git diff origin/main...HEAD --name-only -- '.github/workflows/' || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::CI workflow files modified in this PR:"
            echo "$CHANGED"
            echo ""
            echo "Workflow changes require maintainer review (CODEOWNERS enforced)."
          else
            echo "No workflow changes detected."
          fi

  check-test-duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Scan test files for duplicated blocks
        run: node scripts/check-test-duplication.mjs

  check-file-length:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Report files over length budget (non-blocking)
        # Soft budget: surface the report in logs but never fail the PR gate.
        # Use --strict locally to enforce; CI stays informational.
        continue-on-error: true
        run: node scripts/check-file-length.mjs

  validate-firebase-rules:
    name: Validate Firebase rules changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect rules-related changes
        id: changed
        run: |
          if git diff origin/main...HEAD --name-only | \
             grep -qE '^(firestore\.rules|firestore\.indexes\.json|storage\.rules|rules-tests/)'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.touched == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.changed.outputs.touched == 'true'
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
        if: steps.changed.outputs.touched == 'true'

      - name: Run Firestore rules tests
        if: steps.changed.outputs.touched == 'true'
        run: npm run test:rules

      - name: Skip note
        if: steps.changed.outputs.touched != 'true'
        run: echo "No rules-related changes — skipping rules emulator tests."

  build-functions:
    name: Build and test Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same merge-base requirement as the other change-scoped jobs —
          # without full history the diff returns empty and this gate
          # silently no-ops instead of building the functions package.
          fetch-depth: 0

      - name: Detect functions changes
        id: changed
        run: |
          if git diff origin/main...HEAD --name-only | grep -qE '^functions/'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.touched == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        if: steps.changed.outputs.touched == 'true'
        working-directory: functions
        run: npm ci

      - name: Build functions
        if: steps.changed.outputs.touched == 'true'
        working-directory: functions
        run: npm run build

      - name: Test functions
        if: steps.changed.outputs.touched == 'true'
        working-directory: functions
        run: npm test

      # functions/ has its own lockfile, so the root audit in main.yml never
      # sees it. Block on high/critical only: the remaining moderates come in
      # through firebase-admin → @google-cloud/storage → gaxios 6 → uuid and
      # can't be fixed from here until Google ships a new storage client.
      - name: Audit functions dependencies (blocking on high/critical)
        if: steps.changed.outputs.touched == 'true'
        working-directory: functions
        run: npm audit --audit-level=high

      - name: Skip note
        if: steps.changed.outputs.touched != 'true'
        run: echo "No functions/ changes — skipping Cloud Functions build and tests."
