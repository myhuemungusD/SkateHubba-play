<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0A0A0A" />
    <!-- Dark-only app chrome: keeps iOS form controls + scrollbars rendering
         against the dark surface instead of flashing to light mode defaults. -->
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="description" content="SkateHubba™ — The first async S.K.A.T.E. trick battle game. For the love of the game." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="SkateHubba" />
    <title>SkateHubba™ S.K.A.T.E.</title>
    <!-- Shell paint. The production build marks the app stylesheet media=print
         and withholds the entry module until /lcp-shell.js, so this file is
         the only render-blocking CSS for the first frame. -->
    <link rel="stylesheet" href="/lcp.css" />
    <link rel="canonical" href="https://skatehubba.com/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SkateHubba" />
    <!-- iOS home-screen icon: 180x180 is Apple's canonical apple-touch-icon
         size (60pt @3x). Larger sizes are kept as fallbacks so iPad Pro and
         older Safari versions still pick a sharp asset. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skatehubba.com/" />
    <meta property="og:title" content="SkateHubba™ — For the Love of the Game" />
    <meta property="og:description" content="The first async S.K.A.T.E. trick battle game. For the love of the game." />
    <meta property="og:site_name" content="SkateHubba" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://skatehubba.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SkateHubba — async S.K.A.T.E. trick battle game logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SkateHubba™ — For the Love of the Game" />
    <meta name="twitter:description" content="The first async S.K.A.T.E. trick battle game. For the love of the game." />
    <meta name="twitter:image" content="https://skatehubba.com/og-image.png" />
    <meta name="twitter:image:alt" content="SkateHubba — async S.K.A.T.E. trick battle game logo" />

    <!-- Firebase -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />

    <!-- Brand logo (critical for first paint) -->
    <link rel="preload" href="/logonew.webp" as="image" type="image/webp" />

    <!-- Fonts: self-hosted (see @font-face in src/index.css). Preloaded so the
         hero heading (Bebas Neue, the LCP element) and body copy paint in
         their real faces without a late swap. Vite rewrites these to the
         fingerprinted /assets/ URLs the CSS references. -->
    <link rel="preload" href="/src/assets/fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/dm-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SkateHubba",
      "alternateName": "SkateHubba S.K.A.T.E.",
      "url": "https://skatehubba.com",
      "description": "The first async S.K.A.T.E. trick battle game. For the love of the game.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires a modern browser with camera access",
      "image": "https://skatehubba.com/og-image.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body class="bg-[#0A0A0A] text-white antialiased grain">
    <div class="lcp-shell lcp-shell-home" aria-hidden="true">
      <h1 class="lcp-title"><span class="lcp-word">SKATEHUBBA</span></h1>
      <p class="lcp-sub">For the love of the game.</p>
    </div>
    <div class="lcp-shell lcp-shell-auth" aria-hidden="true">
      <h1 class="lcp-title"><span class="lcp-word">Create Account</span></h1>
      <p class="lcp-sub">Join the crew. It's free. We collect your DOB to comply with COPPA &amp; CCPA.</p>
    </div>
      <div class="lcp-shell lcp-shell-feed" aria-hidden="true">
        <p class="lcp-fill">SKATEHUBBA SKATEHUBBA SKATEHUBBA SKATEHUBBA SKATEHUBBA SKATEHUBBA</p>
      </div>
    <div id="root"></div>
    <script src="/lcp-shell.js" defer></script>
    <script src="/sw-cleanup.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
